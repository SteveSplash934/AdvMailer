<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steve Splash ProMailer+</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: white;
            margin: 2% auto;
            width: 90%;
            height: 90%;
            border-radius: 1.5rem;
            overflow: hidden;
            position: relative;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 300;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        input[type="file"] {
            display: none;
        }

        /* Status Colors */
        .status-sent {
            color: #10b981;
            font-weight: bold;
        }

        .status-failed {
            color: #ef4444;
            font-weight: bold;
        }

        .status-sending {
            color: #3b82f6;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body class="font-sans antialiased">
    <div id="preview-modal" class="modal">
        <div class="modal-content flex flex-col">
            <div class="p-4 bg-slate-100 border-b flex justify-between items-center text-slate-800">
                <span class="font-bold flex items-center gap-2"><i data-lucide="eye" class="w-4 h-4"></i> Sandbox
                    Preview</span>
                <button id="close-modal" class="p-2 hover:bg-slate-200 rounded-full transition-colors"><i
                        data-lucide="x"></i></button>
            </div>
            <iframe id="preview-frame" class="w-full flex-1 border-none bg-white"></iframe>
        </div>
    </div>

    <nav class="sticky top-0 z-50 glass-card px-8 py-4 flex justify-between items-center border-b border-slate-700">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg"><i
                    data-lucide="send" class="text-white"></i></div>
            <h1 class="text-xl font-bold tracking-tight">SteveSplash Pro<span class="text-blue-500">Mailer</span></h1>
        </div>
        <button id="btn-start"
            class="bg-blue-600 hover:bg-blue-700 px-8 py-2 rounded-xl font-bold flex items-center gap-2 transition-all active:scale-95">
            <i data-lucide="play" class="w-4 h-4"></i> START DISPATCH
        </button>
    </nav>

    <div class="flex h-[calc(100vh-73px)]">
        <aside class="w-64 border-r border-slate-800 p-6 space-y-2 shrink-0">
            <button class="nav-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-colors"
                data-section="dashboard"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard</button>
            <button class="nav-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-colors"
                data-section="config"><i data-lucide="settings" class="w-4 h-4"></i> SMTP Settings</button>
            <button class="nav-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-colors"
                data-section="template"><i data-lucide="file-code" class="w-4 h-4"></i> Templates</button>
            <button class="nav-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-colors"
                data-section="recipients"><i data-lucide="users" class="w-4 h-4"></i> Recipients</button>
            <button class="nav-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-colors"
                data-section="logs"><i data-lucide="terminal" class="w-4 h-4"></i> Logs</button>
        </aside>

        <main class="flex-1 overflow-y-auto p-10 no-scrollbar">
            <section id="section-dashboard" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-center">
                    <div class="glass-card p-8 rounded-3xl"><i data-lucide="check-circle"
                            class="mx-auto mb-2 text-green-500"></i>
                        <p class="text-slate-500 text-xs uppercase font-black tracking-widest">Sent</p>
                        <h2 id="stat-sent" class="text-5xl font-black">0</h2>
                    </div>
                    <div class="glass-card p-8 rounded-3xl"><i data-lucide="x-circle"
                            class="mx-auto mb-2 text-red-500"></i>
                        <p class="text-slate-500 text-xs uppercase font-black tracking-widest">Failed</p>
                        <h2 id="stat-failed" class="text-5xl font-black text-red-500">0</h2>
                    </div>
                    <div class="glass-card p-8 rounded-3xl"><i data-lucide="bar-chart"
                            class="mx-auto mb-2 text-blue-500"></i>
                        <p class="text-slate-500 text-xs uppercase font-black tracking-widest">Progress</p>
                        <h2 id="stat-progress" class="text-5xl font-black text-blue-500">0%</h2>
                    </div>
                </div>
                <div class="glass-card rounded-[2rem] overflow-hidden p-10 space-y-4 shadow-xl">
                    <div class="flex justify-between text-[10px] font-mono text-slate-500 uppercase tracking-widest">
                        <span id="current-op">System Idle</span><span id="stat-total-queue">0 Recipients</span>
                    </div>
                    <div class="w-full bg-slate-900 rounded-full h-2">
                        <div id="progress-bar"
                            class="bg-blue-600 h-full rounded-full transition-all duration-700 shadow-[0_0_15px_rgba(37,99,235,0.4)]"
                            style="width: 0%"></div>
                    </div>
                </div>
            </section>

            <section id="section-config" class="hidden space-y-6">
                <div class="flex justify-between items-end">
                    <h2 class="text-3xl font-black">Server Setup</h2>
                    <label for="config-input"
                        class="bg-slate-800 hover:bg-slate-700 px-6 py-3 rounded-2xl cursor-pointer border border-slate-700 flex items-center gap-2 transition-all">
                        <i data-lucide="upload-cloud" class="w-4 h-4"></i> Import config.ini
                        <input type="file" id="config-input" accept=".ini">
                    </label>
                </div>
                <form id="form-config" class="grid grid-cols-2 gap-10 glass-card p-10 rounded-[2.5rem]">
                    <div class="space-y-5">
                        <div><label
                                class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">Host</label><input
                                type="text" name="SMTP.host"
                                class="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4 outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label
                                    class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">Port</label><input
                                    type="number" name="SMTP.port"
                                    class="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4 outline-none">
                            </div>
                            <div><label
                                    class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">Mode</label><select
                                    id="config-mode" name="EMAIL_CONTENT.mode"
                                    class="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4 outline-none">
                                    <option value="html">HTML</option>
                                    <option value="plain">Text</option>
                                </select></div>
                        </div>
                        <div><label
                                class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">User</label><input
                                type="text" name="SMTP.username"
                                class="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4 outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">Pass</label>
                            <div class="relative">
                                <input type="password" id="smtp-pass" name="SMTP.password"
                                    class="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4 pr-12 outline-none">
                                <button type="button" id="toggle-pass"
                                    class="absolute right-4 top-4 text-slate-500 hover:text-white"><i data-lucide="eye"
                                        class="w-5 h-5"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-5">
                        <div><label class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">Sender
                                Name</label><input type="text" name="SENDER.name"
                                class="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4"></div>
                        <div><label class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">Sender
                                Email</label><input type="text" name="SENDER.email"
                                class="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4"></div>
                        <div>
                            <label class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">Selected
                                Template</label>
                            <select id="active-tpl-selector"
                                class="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4 text-blue-400 font-bold text-xs outline-none">
                                <option value="">-- Choose Template --</option>
                            </select>
                            <input type="hidden" id="active-path-hidden" name="EMAIL_CONTENT.html_path">
                            <input type="hidden" id="active-plain-hidden" name="EMAIL_CONTENT.plain_path">
                        </div>
                        <button type="submit"
                            class="w-full bg-blue-600 py-5 rounded-2xl font-black mt-4 shadow-xl shadow-blue-900/20 active:scale-95 transition-all">SAVE
                            SETTINGS</button>
                    </div>
                </form>
            </section>

            <section id="section-template" class="hidden h-full flex flex-col space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-3xl font-black">Templates</h2>
                    <div class="flex gap-4">
                        <label for="tpl-input"
                            class="bg-slate-800 hover:bg-slate-700 px-6 py-2 rounded-xl cursor-pointer border border-slate-700 flex items-center gap-2 text-xs font-bold transition-all">
                            <i data-lucide="file-up" class="w-4 h-4"></i> Upload
                            <input type="file" id="tpl-input" accept=".html,.txt">
                        </label>
                        <button id="open-preview" disabled
                            class="bg-slate-800 border border-slate-700 px-6 py-2 rounded-xl text-xs font-bold opacity-50 cursor-not-allowed">PREVIEW</button>
                        <button id="update-template"
                            class="hidden bg-green-600 px-6 py-2 rounded-xl text-xs font-bold active:scale-95 transition-all">UPDATE
                            FILE</button>
                        <button id="save-template"
                            class="bg-blue-600 px-8 py-2 rounded-xl text-xs font-bold active:scale-95 transition-all">SAVE
                            AS NEW</button>
                    </div>
                </div>
                <div class="flex-1 grid grid-cols-12 gap-8 min-h-0">
                    <div class="col-span-3 glass-card rounded-3xl p-6 overflow-y-auto no-scrollbar border-slate-800">
                        <h3 class="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest">Library</h3>
                        <div id="template-list" class="space-y-3"></div>
                    </div>
                    <div class="col-span-9"><textarea id="template-editor"
                            class="w-full h-full bg-slate-950 text-slate-300 font-mono p-8 rounded-3xl border border-slate-800 outline-none resize-none shadow-inner text-sm"
                            placeholder="Paste HTML/Text content here..."></textarea></div>
                </div>
            </section>

            <section id="section-recipients" class="hidden space-y-6">
                <label for="recipient-input"
                    class="block border-2 border-dashed border-slate-800 rounded-[2.5rem] p-16 text-center hover:border-blue-600 cursor-pointer bg-slate-900/10 transition-all group">
                    <i data-lucide="users" class="w-12 h-12 mx-auto mb-4 text-slate-700 group-hover:text-blue-500"></i>
                    <h3 class="text-xl font-bold">Import Contacts</h3>
                    <p class="text-slate-500 text-sm">Select CSV or TXT file</p>
                    <input type="file" id="recipient-input" accept=".csv,.txt">
                </label>
                <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">
                    <div class="max-h-[500px] overflow-y-auto no-scrollbar">
                        <table class="w-full text-left text-sm" id="recipients-table">
                            <thead
                                class="text-slate-500 text-[10px] uppercase font-black tracking-widest border-b border-slate-800 sticky top-0 bg-[#1e293b]">
                                <tr>
                                    <th class="p-5">#</th>
                                    <th class="p-5">Email Address</th>
                                    <th class="p-5 text-right">Status</th>
                                </tr>
                            </thead>
                            <tbody id="recipients-table-body" class="divide-y divide-slate-800/50"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section id="section-logs" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-3xl font-black text-slate-200">System Logs</h2><button id="clear-logs-btn"
                        class="bg-red-900/20 text-red-400 px-6 py-2 rounded-xl border border-red-900/30 text-xs font-bold hover:bg-red-900/40">CLEAR
                        LOGS</button>
                </div>
                <pre id="log-viewer"
                    class="w-full h-[600px] bg-slate-950 p-8 rounded-[2rem] font-mono text-xs text-green-500/80 overflow-y-auto no-scrollbar border border-slate-900 shadow-2xl"></pre>
            </section>
        </main>
    </div>

    <div id="toast" class="toast">
        <div class="bg-blue-600/20 p-2 rounded-lg"><i data-lucide="info" class="w-4 h-4 text-blue-500"></i></div>
        <span id="toast-msg" class="font-bold text-sm"></span>
    </div>

    <script>
        lucide.createIcons();
        let currentTplFilename = null;
        let currentModePaths = { html: '', plain: '' };

        function notify(msg) {
            $('#toast-msg').text(msg);
            $('#toast').addClass('show');
            setTimeout(() => $('#toast').removeClass('show'), 3000);
        }

        function switchSection(id) {
            $('.nav-btn').removeClass('bg-blue-600/20 text-blue-400 font-bold border border-blue-500/20');
            $(`.nav-btn[data-section="${id}"]`).addClass('bg-blue-600/20 text-blue-400 font-bold border border-blue-500/20');
            $('main > section').addClass('hidden');
            $(`#section-${id}`).removeClass('hidden');
            localStorage.setItem('activeSection', id);
        }

        $('.nav-btn').click(function () { switchSection($(this).data('section')); });
        switchSection(localStorage.getItem('activeSection') || 'dashboard');

        $('#toggle-pass').click(function () {
            const input = $('#smtp-pass');
            const type = input.attr('type') === 'password' ? 'text' : 'password';
            input.attr('type', type);
            $(this).html(type === 'password' ? '<i data-lucide="eye" class="w-5 h-5"></i>' : '<i data-lucide="eye-off" class="w-5 h-5"></i>');
            lucide.createIcons();
        });

        function loadConfig() {
            $.get('/api/config', function (data) {
                if (!data) return;
                for (const section in data) {
                    for (const key in data[section]) {
                        $(`[name="${section}.${key}"]`).val(data[section][key]);
                    }
                }
                currentModePaths.html = data.EMAIL_CONTENT ? data.EMAIL_CONTENT.html_path : '';
                currentModePaths.plain = data.EMAIL_CONTENT ? data.EMAIL_CONTENT.plain_path : '';
                $('#config-mode').trigger('change');
            });
        }

        $('#config-mode').change(function () {
            const mode = $(this).val();
            const hiddenInput = $('#active-path-hidden');
            const path = mode === 'html' ? currentModePaths.html : currentModePaths.plain;
            hiddenInput.val(path);
            hiddenInput.attr('name', mode === 'html' ? 'EMAIL_CONTENT.html_path' : 'EMAIL_CONTENT.plain_path');
        });

        $('#form-config').submit(function (e) {
            e.preventDefault();
            const data = {};
            $(this).serializeArray().forEach(i => {
                const [s, k] = i.name.split('.');
                if (!data[s]) data[s] = {};
                data[s][k] = i.value;
            });
            $.ajax({ url: '/api/config', type: 'POST', contentType: 'application/json', data: JSON.stringify(data), success: () => notify('Settings Saved') });
        });

        function loadTemplateList() {
            $.get('/api/templates/list', (data) => {
                const list = $('#template-list').empty();
                const selector = $('#active-tpl-selector').empty().append('<option value="">-- Choose Template --</option>');
                data.forEach(t => {
                    const btn = $(`<div class="p-4 rounded-2xl border border-slate-800 bg-slate-900/40 hover:border-blue-500 cursor-pointer transition-all active:scale-95"><div class="text-[9px] text-slate-500 uppercase font-black mb-1">${t.type}</div><div class="text-xs font-bold truncate">${t.name}</div></div>`);
                    btn.click(() => loadTemplateContent(t));
                    list.append(btn);
                    selector.append(`<option value="uploads/templates/${t.filename}" data-type="${t.type}">${t.name}</option>`);
                });
                const currentPath = $('#active-path-hidden').val();
                if (currentPath) $('#active-tpl-selector').val(currentPath);
            });
        }

        function loadTemplateContent(t) {
            currentTplFilename = t.filename;
            $.get(`/api/template/content?filename=${t.filename}`, (res) => {
                $('#template-editor').val(res.content).trigger('input');
                $('#update-template').removeClass('hidden');
                notify(`Editing: ${t.name}`);
            });
        }

        $('#active-tpl-selector').change(function () {
            const val = $(this).val();
            const type = $(this).find(':selected').data('type');
            if (val) {
                $('#active-path-hidden').val(val);
                $('#active-plain-hidden').val(val);
                $('#config-mode').val(type).trigger('change');
                notify(`Dispatch Template Set`);
            }
        });

        $('#update-template').click(function () {
            if (!currentTplFilename) return;
            $.ajax({
                url: '/api/templates/update', type: 'POST', contentType: 'application/json',
                data: JSON.stringify({ filename: currentTplFilename, content: $('#template-editor').val() }),
                success: () => notify('File Updated')
            });
        });

        $('#save-template').click(function () {
            const content = $('#template-editor').val();
            if (!content.trim()) return notify("Editor empty");
            const name = prompt("Name:");
            if (!name) return;
            const type = (content.includes('<html>') || content.includes('</div>')) ? 'html' : 'plain';
            $.ajax({
                url: '/api/templates/save', type: 'POST', contentType: 'application/json',
                data: JSON.stringify({ name, content, type }),
                success: () => { loadTemplateList(); notify("Saved"); }
            });
        });

        $('#template-editor').on('input', function () {
            const hasContent = $(this).val().trim() !== '';
            $('#open-preview').prop('disabled', !hasContent).css('opacity', hasContent ? 1 : 0.5).css('cursor', hasContent ? 'pointer' : 'not-allowed');
        });

        $('#open-preview').click(() => {
            const iframe = $('#preview-frame')[0].contentWindow.document;
            iframe.open(); iframe.write($('#template-editor').val()); iframe.close();
            $('#preview-modal').fadeIn(200);
        });
        $('#close-modal').click(() => $('#preview-modal').fadeOut(200));

        $('#clear-logs-btn').click(() => { $.post('/api/logs/clear', () => { $('#log-viewer').text(''); notify('Cleared'); }); });

        $('#recipient-input').on('change', function (e) {
            if (!e.target.files.length) return;
            const formData = new FormData();
            formData.append('file', e.target.files[0]);
            $.ajax({
                url: '/api/recipients', type: 'POST', data: formData, processData: false, contentType: false,
                success: (data) => {
                    $('#stat-total-queue').text(`${data.count} Ready`);
                    const tbody = $('#recipients-table-body').empty();
                    data.recipients.forEach((email, i) => tbody.append(`
                        <tr class="hover:bg-slate-800/30 transition-colors" data-email="${email}">
                            <td class="p-5 text-slate-500 font-mono text-xs">${i + 1}</td>
                            <td class="p-5 font-bold">${email}</td>
                            <td class="p-5 text-right status-col text-xs text-slate-400 font-black uppercase">Ready</td>
                        </tr>
                    `));
                    notify(`Imported ${data.count} contacts`);
                }
            });
        });

        $('#btn-start').click(() => {
            $.post('/api/mailer/start', () => { switchSection('dashboard'); notify('Engine Started'); })
                .fail(e => notify(e.responseJSON.error));
        });

        // POLLING: Dashboard counters & Recipient Table Status
        setInterval(() => {
            $.get('/api/mailer/status', (data) => {
                if (data.running) {
                    $('#stat-sent').text(data.progress.sent);
                    $('#stat-failed').text(data.progress.failed);
                    const p = Math.round(((data.progress.sent + data.progress.failed) / data.progress.total) * 100);
                    $('#stat-progress').text(p + '%');
                    $('#progress-bar').css('width', p + '%');
                    $('#current-op').text('Sending: ' + data.progress.current_email);

                    // Update Table statuses
                    if (data.progress.recipient_statuses) {
                        for (const [email, status] of Object.entries(data.progress.recipient_statuses)) {
                            const row = $(`tr[data-email="${email}"] .status-col`);
                            row.text(status);
                            if (status === "Sent") row.removeClass().addClass('p-5 text-right status-col status-sent');
                            else if (status === "Failed") row.removeClass().addClass('p-5 text-right status-col status-failed');
                            else if (status.includes("Sending")) row.removeClass().addClass('p-5 text-right status-col status-sending');
                        }
                    }
                }
            });
            $.get('/api/logs', (d) => { const v = $('#log-viewer'); v.text(d); v.scrollTop(v[0].scrollHeight); });
        }, 1500);

        $(document).ready(() => { loadConfig(); loadTemplateList(); });
    </script>
</body>

</html>
