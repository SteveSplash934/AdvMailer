<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steve Splash ProMailer+</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: white;
            margin: 2% auto;
            width: 90%;
            height: 90%;
            border-radius: 1.5rem;
            overflow: hidden;
            position: relative;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 300;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        input[type="file"] {
            display: none;
        }

        .status-sent {
            color: #10b981 !important;
            font-weight: bold;
        }

        .status-failed {
            color: #ef4444 !important;
            font-weight: bold;
        }

        .status-sending {
            color: #3b82f6 !important;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Smooth Transition for Sidebar */
        #sidebar {
            transition: width 0.3s ease, padding 0.3s ease;
        }
    </style>
</head>

<body class="font-sans antialiased">
    <!-- Preview Modal -->
    <div id="preview-modal" class="modal">
        <div class="modal-content flex flex-col">
            <div class="p-4 bg-slate-100 border-b flex justify-between items-center text-slate-800">
                <span class="font-bold flex items-center gap-2"><i data-lucide="eye" class="w-4 h-4"></i> Sandbox
                    Preview</span>
                <button id="close-modal" class="p-2 hover:bg-slate-200 rounded-full transition-colors"><i
                        data-lucide="x"></i></button>
            </div>
            <iframe id="preview-frame" class="w-full flex-1 border-none bg-white"></iframe>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 glass-card px-8 py-4 flex justify-between items-center border-b border-slate-700">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg"><i
                    data-lucide="send" class="text-white"></i></div>
            <h1 class="text-xl font-bold tracking-tight">SteveSplash Pro<span class="text-blue-500">Mailer</span></h1>
        </div>
        <div class="flex gap-3">
            <!-- RETRY BUTTON -->
            <button id="btn-retry"
                class="hidden bg-yellow-600 hover:bg-yellow-700 px-8 py-2 rounded-xl font-bold flex items-center gap-2 transition-all active:scale-95">
                <i data-lucide="refresh-cw" class="w-4 h-4 fill-white"></i> RETRY FAILED
            </button>
            <!-- STOP BUTTON -->
            <button id="btn-stop"
                class="hidden bg-red-600 hover:bg-red-700 px-8 py-2 rounded-xl font-bold flex items-center gap-2 transition-all active:scale-95">
                <i data-lucide="square" class="w-4 h-4 fill-white"></i> STOP ENGINE
            </button>
            <!-- START BUTTON -->
            <button id="btn-start"
                class="bg-blue-600 hover:bg-blue-700 px-8 py-2 rounded-xl font-bold flex items-center gap-2 transition-all active:scale-95">
                <i data-lucide="play" class="w-4 h-4 fill-white"></i> START DISPATCH
            </button>
        </div>
    </nav>

    <div class="flex h-[calc(100vh-73px)]">
        <!-- Sidebar -->
        <aside id="sidebar"
            class="w-64 border-r border-slate-800 p-6 flex flex-col gap-2 shrink-0 overflow-y-auto no-scrollbar">
            <!-- Toggle Button -->
            <button id="toggle-sidebar"
                class="w-full text-left px-4 py-3 rounded-xl flex items-center justify-start gap-3 transition-colors hover:bg-slate-800 text-slate-400 mb-4"
                title="Toggle Sidebar">
                <i data-lucide="panel-left-close" id="toggle-icon" class="w-5 h-5 shrink-0"></i>
                <span class="sidebar-text font-bold uppercase tracking-widest text-[10px]">Collapse</span>
            </button>

            <!-- Menu Items -->
            <button
                class="nav-btn w-full px-4 py-3 rounded-xl flex items-center justify-start gap-3 transition-colors hover:bg-slate-800"
                data-section="dashboard" title="Dashboard">
                <i data-lucide="layout-dashboard" class="w-5 h-5 shrink-0"></i>
                <span class="sidebar-text font-medium whitespace-nowrap">Dashboard</span>
            </button>
            <button
                class="nav-btn w-full px-4 py-3 rounded-xl flex items-center justify-start gap-3 transition-colors hover:bg-slate-800"
                data-section="config" title="SMTP Settings">
                <i data-lucide="settings" class="w-5 h-5 shrink-0"></i>
                <span class="sidebar-text font-medium whitespace-nowrap">SMTP Settings</span>
            </button>
            <button
                class="nav-btn w-full px-4 py-3 rounded-xl flex items-center justify-start gap-3 transition-colors hover:bg-slate-800"
                data-section="template" title="Templates">
                <i data-lucide="file-code" class="w-5 h-5 shrink-0"></i>
                <span class="sidebar-text font-medium whitespace-nowrap">Templates</span>
            </button>
            <button
                class="nav-btn w-full px-4 py-3 rounded-xl flex items-center justify-start gap-3 transition-colors hover:bg-slate-800"
                data-section="recipients" title="Recipients">
                <i data-lucide="users" class="w-5 h-5 shrink-0"></i>
                <span class="sidebar-text font-medium whitespace-nowrap">Recipients</span>
            </button>
            <button
                class="nav-btn w-full px-4 py-3 rounded-xl flex items-center justify-start gap-3 transition-colors hover:bg-slate-800"
                data-section="history" title="Job History">
                <i data-lucide="history" class="w-5 h-5 shrink-0"></i>
                <span class="sidebar-text font-medium whitespace-nowrap">Job History</span>
            </button>
            <button
                class="nav-btn w-full px-4 py-3 rounded-xl flex items-center justify-start gap-3 transition-colors hover:bg-slate-800"
                data-section="logs" title="System Logs">
                <i data-lucide="terminal" class="w-5 h-5 shrink-0"></i>
                <span class="sidebar-text font-medium whitespace-nowrap">Logs</span>
            </button>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-10 no-scrollbar">
            <!-- Dashboard Section -->
            <section id="section-dashboard" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-center">
                    <div class="glass-card p-8 rounded-3xl"><i data-lucide="check-circle"
                            class="mx-auto mb-2 text-green-500"></i>
                        <p class="text-slate-500 text-xs uppercase font-black tracking-widest">Sent</p>
                        <h2 id="stat-sent" class="text-5xl font-black">0</h2>
                    </div>
                    <div class="glass-card p-8 rounded-3xl"><i data-lucide="x-circle"
                            class="mx-auto mb-2 text-red-500"></i>
                        <p class="text-slate-500 text-xs uppercase font-black tracking-widest">Failed</p>
                        <h2 id="stat-failed" class="text-5xl font-black text-red-500">0</h2>
                    </div>
                    <div class="glass-card p-8 rounded-3xl"><i data-lucide="bar-chart"
                            class="mx-auto mb-2 text-blue-500"></i>
                        <p class="text-slate-500 text-xs uppercase font-black tracking-widest">Progress</p>
                        <h2 id="stat-progress" class="text-5xl font-black text-blue-500">0%</h2>
                    </div>
                </div>
                <div class="glass-card rounded-[2rem] overflow-hidden p-10 space-y-4 shadow-xl">
                    <div class="flex justify-between text-[10px] font-mono text-slate-500 uppercase tracking-widest">
                        <span id="current-op">System Idle</span><span id="stat-total-queue">0 Recipients</span>
                    </div>
                    <div class="w-full bg-slate-900 rounded-full h-2">
                        <div id="progress-bar"
                            class="bg-blue-600 h-full rounded-full transition-all duration-700 shadow-[0_0_15px_rgba(37,99,235,0.4)]"
                            style="width: 0%"></div>
                    </div>
                </div>
            </section>

            <!-- SMTP Settings Section -->
            <section id="section-config" class="hidden space-y-6">
                <div class="flex justify-between items-end">
                    <h2 class="text-3xl font-black">Server Setup</h2>
                    <label for="config-input"
                        class="bg-slate-800 hover:bg-slate-700 px-6 py-3 rounded-2xl cursor-pointer border border-slate-700 flex items-center gap-2 transition-all">
                        <i data-lucide="upload-cloud" class="w-4 h-4"></i> Import config.ini
                        <input type="file" id="config-input" accept=".ini">
                    </label>
                </div>
                <form id="form-config" class="grid grid-cols-2 gap-10 glass-card p-10 rounded-[2.5rem]">
                    <div class="space-y-5">
                        <div><label
                                class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">Subject</label><input
                                type="text" name="EMAIL_CONTENT.subject"
                                class="w-full bg-slate-900 border border-slate-800 rounded-xl p-4 outline-none focus:border-blue-500"
                                placeholder="Enter Email Subject"></div>
                        <div><label
                                class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">Host</label><input
                                type="text" name="SMTP.host"
                                class="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4 outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label
                                    class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">Port</label><input
                                    type="number" name="SMTP.port"
                                    class="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4 outline-none">
                            </div>
                            <div><label
                                    class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">Mode</label><select
                                    id="config-mode" name="EMAIL_CONTENT.mode"
                                    class="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4 outline-none">
                                    <option value="html">HTML</option>
                                    <option value="plain">Text</option>
                                </select></div>
                        </div>
                        <div><label
                                class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">User</label><input
                                type="text" name="SMTP.username"
                                class="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4 outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">Pass</label>
                            <div class="relative">
                                <input type="password" id="smtp-pass" name="SMTP.password"
                                    class="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4 pr-12 outline-none">
                                <button type="button" id="toggle-pass"
                                    class="absolute right-4 top-4 text-slate-500 hover:text-white transition-colors"><i
                                        data-lucide="eye" class="w-5 h-5"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-5">
                        <div><label class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">Sender
                                Name</label><input type="text" name="SENDER.name"
                                class="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4"></div>
                        <div><label class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">Sender
                                Email</label><input type="text" name="SENDER.email"
                                class="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4"></div>
                        <div>
                            <label class="block text-[10px] text-slate-500 uppercase font-black ml-1 mb-1">Selected
                                Template</label>
                            <select id="active-tpl-selector"
                                class="w-full bg-slate-900/50 border border-slate-800 rounded-xl p-4 text-blue-400 font-bold text-xs outline-none focus:border-blue-500">
                                <option value="">-- Choose Template --</option>
                            </select>
                            <input type="hidden" id="active-path-hidden" name="EMAIL_CONTENT.html_path">
                            <input type="hidden" id="active-plain-hidden" name="EMAIL_CONTENT.plain_path">
                        </div>

                        <!-- SMTP Buttons -->
                        <div class="flex gap-4 pt-4">
                            <button type="button" id="test-smtp-btn"
                                class="w-1/3 bg-slate-700 hover:bg-slate-600 py-5 rounded-2xl font-black shadow-xl active:scale-95 transition-all text-[11px]"><i
                                    data-lucide="plug" class="w-4 h-4 inline mr-1"></i> TEST SMTP</button>
                            <button type="submit"
                                class="w-2/3 bg-blue-600 py-5 rounded-2xl font-black shadow-xl shadow-blue-900/20 active:scale-95 transition-all">SAVE
                                SETTINGS</button>
                        </div>
                    </div>
                </form>
            </section>

            <!-- Template Editor & Attachments Section -->
            <section id="section-template" class="hidden h-full flex flex-col space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-3xl font-black">Templates & Attachments</h2>
                    <div class="flex gap-4">
                        <label for="tpl-input"
                            class="bg-slate-800 hover:bg-slate-700 px-6 py-2 rounded-xl cursor-pointer border border-slate-700 flex items-center gap-2 text-xs font-bold transition-all">
                            <i data-lucide="file-up" class="w-4 h-4"></i> Upload
                            <input type="file" id="tpl-input" accept=".html,.txt">
                        </label>
                        <button id="open-preview" disabled
                            class="bg-slate-800 border border-slate-700 px-6 py-2 rounded-xl text-xs font-bold opacity-50 cursor-not-allowed">PREVIEW</button>
                        <button id="close-template"
                            class="hidden bg-slate-700 px-6 py-2 rounded-xl text-xs font-bold active:scale-95 transition-all">CLOSE</button>
                        <button id="update-template"
                            class="hidden bg-green-600 px-6 py-2 rounded-xl text-xs font-bold active:scale-95 transition-all">UPDATE
                            FILE</button>
                        <button id="save-template"
                            class="bg-blue-600 px-8 py-2 rounded-xl text-xs font-bold active:scale-95 transition-all">SAVE
                            AS NEW</button>
                    </div>
                </div>
                <div class="flex-1 grid grid-cols-12 gap-8 min-h-0">
                    <div id="template-list"
                        class="col-span-3 glass-card rounded-3xl p-6 overflow-y-auto no-scrollbar border-slate-800 space-y-3">
                    </div>
                    <div class="col-span-9 flex flex-col gap-6">
                        <textarea id="template-editor"
                            class="w-full flex-1 bg-slate-950 text-slate-300 font-mono p-8 rounded-3xl border border-slate-800 outline-none resize-none shadow-inner text-sm"
                            placeholder="Paste HTML/Text content here..."></textarea>

                        <!-- ATTACHMENTS SUB-SECTION -->
                        <div class="glass-card rounded-3xl p-6 border border-slate-800">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="font-bold text-sm uppercase tracking-widest text-slate-400">Mail Attachments
                                </h3>
                                <label for="attachment-input"
                                    class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-xs font-bold cursor-pointer transition-all">
                                    <i data-lucide="paperclip" class="w-3 h-3 inline mr-1"></i> Add Files
                                    <input type="file" id="attachment-input" multiple>
                                </label>
                            </div>
                            <div id="attachments-list" class="space-y-2 max-h-32 overflow-y-auto no-scrollbar">
                                <!-- Attachment items populate here -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Recipients Section -->
            <section id="section-recipients" class="hidden space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-3xl font-black">Recipients</h2>
                    <button id="clear-recipients-btn"
                        class="bg-red-900/20 text-red-400 px-6 py-2 rounded-xl text-xs font-bold transition-all hover:bg-red-900/40">CLEAR
                        CONTACTS</button>
                </div>
                <label for="recipient-input" id="recipient-drop"
                    class="block border-2 border-dashed border-slate-800 rounded-[2.5rem] p-16 text-center hover:border-blue-600 cursor-pointer bg-slate-900/10 transition-all group">
                    <i data-lucide="users"
                        class="w-12 h-12 mx-auto mb-4 text-slate-700 group-hover:text-blue-500 transition-colors"></i>
                    <h3 class="text-xl font-bold">Import Contacts</h3>
                    <p class="text-slate-500 text-sm">Drag & drop CSV or TXT file here</p>
                    <input type="file" id="recipient-input" accept=".csv,.txt">
                </label>
                <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">
                    <div class="max-h-[500px] overflow-y-auto no-scrollbar">
                        <table class="w-full text-left text-sm" id="recipients-table">
                            <thead
                                class="text-slate-500 text-[10px] uppercase font-black tracking-widest border-b border-slate-800 sticky top-0 bg-[#1e293b]">
                                <tr>
                                    <th class="p-5">#</th>
                                    <th class="p-5">Email Address</th>
                                    <th class="p-5 text-right">Status</th>
                                </tr>
                            </thead>
                            <tbody id="recipients-table-body" class="divide-y divide-slate-800/50"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- Job History Section -->
            <section id="section-history" class="hidden space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-3xl font-black">Job History</h2>
                    <button id="refresh-history-btn"
                        class="bg-slate-800 hover:bg-slate-700 px-6 py-2 rounded-xl text-xs font-bold transition-all"><i
                            data-lucide="refresh-cw" class="w-4 h-4 inline mr-1"></i> Refresh</button>
                </div>
                <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">
                    <div class="max-h-[600px] overflow-y-auto no-scrollbar">
                        <table class="w-full text-left text-sm">
                            <thead
                                class="text-slate-500 text-[10px] uppercase font-black tracking-widest border-b border-slate-800 sticky top-0 bg-[#1e293b]">
                                <tr>
                                    <th class="p-5">Date</th>
                                    <th class="p-5">Subject</th>
                                    <th class="p-5">Sent</th>
                                    <th class="p-5">Failed</th>
                                    <th class="p-5 text-right">Status</th>
                                </tr>
                            </thead>
                            <tbody id="history-table-body" class="divide-y divide-slate-800/50"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- Logs Section -->
            <section id="section-logs" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-3xl font-black text-slate-200">Live Logs</h2>
                    <button id="clear-logs-btn"
                        class="bg-red-900/20 text-red-400 px-6 py-2 rounded-xl border border-red-900/30 text-xs font-bold hover:bg-red-900/40 transition-all">CLEAR
                        LOGS</button>
                </div>
                <pre id="log-viewer"
                    class="w-full h-[600px] bg-slate-950 p-8 rounded-[2rem] font-mono text-xs text-green-500/80 overflow-y-auto no-scrollbar border border-slate-900 shadow-2xl flex flex-col"></pre>
            </section>
        </main>
    </div>

    <div id="toast" class="toast"><i data-lucide="info" class="w-4 h-4 text-blue-500"></i><span id="toast-msg"
            class="font-bold text-sm"></span></div>

    <script>
        lucide.createIcons();
        let selectedTplFile = null;
        let modePaths = { html: '', plain: '' };

        function notify(msg) { $('#toast-msg').text(msg); $('#toast').addClass('show'); setTimeout(() => $('#toast').removeClass('show'), 3000); }

        // --- SIDEBAR TOGGLE & NAVIGATION ---
        const sidebar = $('#sidebar');

        function applySidebarState(collapsed) {
            if (collapsed) {
                sidebar.removeClass('w-64 p-6').addClass('w-20 p-4 items-center');
                $('.sidebar-text').addClass('hidden');
                $('.nav-btn').removeClass('justify-start px-4').addClass('justify-center px-0');
                $('#toggle-sidebar').removeClass('justify-start px-4').addClass('justify-center px-0');
                $('#toggle-icon').attr('data-lucide', 'panel-left-open');
            } else {
                sidebar.removeClass('w-20 p-4 items-center').addClass('w-64 p-6');
                $('.sidebar-text').removeClass('hidden');
                $('.nav-btn').removeClass('justify-center px-0').addClass('justify-start px-4');
                $('#toggle-sidebar').removeClass('justify-center px-0').addClass('justify-start px-4');
                $('#toggle-icon').attr('data-lucide', 'panel-left-close');
            }
            lucide.createIcons();
        }

        $('#toggle-sidebar').click(() => {
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            localStorage.setItem('sidebarCollapsed', !isCollapsed);
            applySidebarState(!isCollapsed);
        });

        function switchSection(id) {
            $('.nav-btn').removeClass('bg-blue-600/20 text-blue-400 font-bold border border-blue-500/20');
            $(`.nav-btn[data-section="${id}"]`).addClass('bg-blue-600/20 text-blue-400 font-bold border border-blue-500/20');
            $('main > section').addClass('hidden'); $(`#section-${id}`).removeClass('hidden');
            localStorage.setItem('activeSection', id);

            if (id === 'history') loadHistory();
            if (id === 'template') loadAttachments();
        }

        $('.nav-btn').click(function () { switchSection($(this).data('section')); });

        // Initial Sidebar & Section setup
        applySidebarState(localStorage.getItem('sidebarCollapsed') === 'true');
        switchSection(localStorage.getItem('activeSection') || 'dashboard');

        // --- CONFIG & SMTP TESTER ---
        $('#toggle-pass').click(function () {
            const input = $('#smtp-pass');
            const type = input.attr('type') === 'password' ? 'text' : 'password';
            input.attr('type', type);
            $(this).html(type === 'password' ? '<i data-lucide="eye" class="w-5 h-5"></i>' : '<i data-lucide="eye-off" class="w-5 h-5"></i>');
            lucide.createIcons();
        });

        function loadConfig() {
            $.get('/api/config', (data) => {
                if (!data) return;
                for (const s in data) for (const k in data[s]) $(`[name="${s}.${k}"]`).val(data[s][k]);
                modePaths.html = data.EMAIL_CONTENT ? data.EMAIL_CONTENT.html_path : '';
                modePaths.plain = data.EMAIL_CONTENT ? data.EMAIL_CONTENT.plain_path : '';
                $('#config-mode').trigger('change');
            });
        }

        $('#config-mode').change(function () {
            const m = $(this).val();
            $('#active-path-hidden').val(m === 'html' ? modePaths.html : modePaths.plain);
        });

        $('#form-config').submit(function (e) {
            e.preventDefault(); const data = {};
            $(this).serializeArray().forEach(i => { const [s, k] = i.name.split('.'); if (!data[s]) data[s] = {}; data[s][k] = i.value; });
            $.ajax({ url: '/api/config', type: 'POST', contentType: 'application/json', data: JSON.stringify(data), success: () => notify('Settings Saved') });
        });

        $('#test-smtp-btn').click(function () {
            notify('Testing SMTP Connection...');
            const data = {};
            $('#form-config').serializeArray().forEach(i => { const [s, k] = i.name.split('.'); if (!data[s]) data[s] = {}; data[s][k] = i.value; });
            $.ajax({
                url: '/api/test-smtp', type: 'POST', contentType: 'application/json', data: JSON.stringify(data),
                success: (res) => notify(res.message || 'Connection Successful!'),
                error: (err) => notify(err.responseJSON?.error || 'Connection Failed!')
            });
        });

        // --- TEMPLATES ---
        function loadTemplates() {
            $.get('/api/templates/list', (data) => {
                const list = $('#template-list').empty();
                const sel = $('#active-tpl-selector').empty().append('<option value="">-- Choose Template --</option>');
                data.forEach(t => {
                    const el = $(`<div class="p-4 rounded-2xl border border-slate-800 bg-slate-900/40 hover:border-blue-500 cursor-pointer transition-all"><div class="text-[9px] text-slate-500 font-black uppercase mb-1">${t.type}</div><div class="text-xs font-bold truncate">${t.name}</div></div>`);
                    el.click(() => {
                        selectedTplFile = t.filename;
                        $.get(`/api/template/content?filename=${t.filename}`, (res) => {
                            $('#template-editor').val(res.content).trigger('input');
                            $('#update-template').removeClass('hidden');
                            $('#close-template').removeClass('hidden');
                            notify(`Editing: ${t.name}`);
                        });
                    });
                    list.append(el);
                    sel.append(`<option value="uploads/templates/${t.filename}" data-type="${t.type}">${t.name}</option>`);
                });
                const currentPath = $('#active-path-hidden').val();
                if (currentPath) $('#active-tpl-selector').val(currentPath);
            });
        }

        $('#active-tpl-selector').change(function () {
            const val = $(this).val();
            const type = $(this).find(':selected').data('type');
            if (val) {
                $('#active-path-hidden').val(val);
                $('#active-plain-hidden').val(val);
                $('#config-mode').val(type).trigger('change');
                notify('Template Set');
            }
        });

        $('#update-template').click(function () {
            if (!selectedTplFile) return;
            $.ajax({ url: '/api/templates/update', type: 'POST', contentType: 'application/json', data: JSON.stringify({ filename: selectedTplFile, content: $('#template-editor').val() }), success: () => notify('Updated') });
        });

        $('#close-template').click(function () {
            selectedTplFile = null;
            $('#template-editor').val('').trigger('input');
            $('#update-template').addClass('hidden');
            $('#close-template').addClass('hidden');
            notify('Closed Editor');
        });

        $('#save-template').click(function () {
            const content = $('#template-editor').val();
            if (!content) return notify("Editor Empty");
            const name = prompt("Name:"); if (!name) return;
            const type = content.includes('<html>') ? 'html' : 'plain';
            $.ajax({ url: '/api/templates/save', type: 'POST', contentType: 'application/json', data: JSON.stringify({ name, content, type }), success: () => { loadTemplates(); notify('Saved'); } });
        });

        $('#template-editor').on('input', function () { $('#open-preview').prop('disabled', !$(this).val()).css('opacity', $(this).val() ? 1 : 0.5); });
        $('#open-preview').click(() => { const doc = $('#preview-frame')[0].contentWindow.document; doc.open(); doc.write($('#template-editor').val()); doc.close(); $('#preview-modal').fadeIn(); });
        $('#close-modal').click(() => $('#preview-modal').fadeOut());

        // --- ATTACHMENTS ---
        $('#attachment-input').on('change', function (e) {
            if (!e.target.files.length) return;
            const formData = new FormData();
            for (let i = 0; i < e.target.files.length; i++) { formData.append('files', e.target.files[i]); }
            $.ajax({ url: '/api/attachments', type: 'POST', data: formData, processData: false, contentType: false, success: (d) => { notify('Attached'); loadAttachments(); } });
        });

        function loadAttachments() {
            $.get('/api/attachments', (data) => {
                const list = $('#attachments-list').empty();
                if (data.files && data.files.length) {
                    data.files.forEach(f => list.append(`
                        <div class="flex justify-between items-center bg-slate-900/50 p-3 rounded-xl border border-slate-800">
                            <span class="text-xs font-bold font-mono text-slate-300 truncate"><i data-lucide="file" class="w-3 h-3 inline mr-2 text-slate-500"></i>${f}</span>
                            <button class="text-red-500 hover:text-red-400 font-bold text-[10px] uppercase tracking-widest px-2" onclick="removeAttachment('${f}')">Remove</button>
                        </div>
                    `));
                    lucide.createIcons();
                } else {
                    list.append('<div class="text-xs text-slate-500 italic p-2">No attachments added.</div>');
                }
            });
        }

        window.removeAttachment = function (filename) {
            $.ajax({ url: `/api/attachments/${filename}`, type: 'DELETE', success: () => { notify('Removed'); loadAttachments(); } });
        }

        // --- RECIPIENTS ---
        const recDrop = $('#recipient-drop');
        recDrop.on('dragover', (e) => { e.preventDefault(); recDrop.addClass('border-blue-500 bg-slate-800/50'); });
        recDrop.on('dragleave', (e) => { e.preventDefault(); recDrop.removeClass('border-blue-500 bg-slate-800/50'); });
        recDrop.on('drop', (e) => {
            e.preventDefault(); recDrop.removeClass('border-blue-500 bg-slate-800/50');
            const files = e.originalEvent.dataTransfer.files;
            if (files.length) { $('#recipient-input')[0].files = files; $('#recipient-input').trigger('change'); }
        });

        $('#recipient-input').on('change', function (e) {
            if (!e.target.files.length) return;
            const formData = new FormData(); formData.append('file', e.target.files[0]);
            $.ajax({
                url: '/api/recipients', type: 'POST', data: formData, processData: false, contentType: false, success: (d) => {
                    $('#stat-total-queue').text(`${d.count} Ready`);
                    const body = $('#recipients-table-body').empty();
                    d.recipients.forEach((em, i) => body.append(`<tr data-email="${em.replace(/["\\]/g, '\\$&')}"><td class="p-5 text-slate-500">${i + 1}</td><td class="p-5 font-bold">${em}</td><td class="p-5 text-right status-col text-slate-400 text-xs font-black uppercase">Ready</td></tr>`));
                    notify(`Imported ${d.count} contacts`);
                }
            });
        });

        $('#clear-recipients-btn').click(() => {
            $.post('/api/recipients/clear', () => {
                $('#stat-total-queue').text(`0 Ready`);
                $('#recipients-table-body').empty();
                notify('Contacts Cleared');
            });
        });

        // --- HISTORY ---
        function loadHistory() {
            $.get('/api/history', (data) => {
                const tbody = $('#history-table-body').empty();
                if (data && data.length) {
                    data.forEach(job => tbody.append(`
                        <tr class="hover:bg-slate-800/30 transition-colors">
                            <td class="p-5 text-slate-400 font-mono text-xs">${job.date}</td>
                            <td class="p-5 font-bold">${job.subject}</td>
                            <td class="p-5 text-green-500 font-bold">${job.sent}</td>
                            <td class="p-5 text-red-500 font-bold">${job.failed}</td>
                            <td class="p-5 text-right text-[10px] font-black uppercase tracking-widest ${job.status === 'Completed' ? 'text-blue-500' : (job.status === 'Running' ? 'text-yellow-500' : 'text-red-500')}">${job.status}</td>
                        </tr>
                    `));
                }
            });
        }
        $('#refresh-history-btn').click(loadHistory);

        // --- ENGINE CONTROLS ---
        $('#btn-start').click(() => $.post('/api/mailer/start', () => { switchSection('dashboard'); notify('Started'); }).fail(e => notify(e.responseJSON?.error || "Error Starting")));
        $('#btn-stop').click(() => $.post('/api/mailer/stop', () => notify('Stop Signal Sent')));
        $('#btn-retry').click(() => $.post('/api/mailer/retry', () => { switchSection('dashboard'); notify('Retrying Failed...'); }).fail(e => notify(e.responseJSON?.error || "Error")));

        setInterval(() => {
            $.get('/api/mailer/status', (data) => {
                if (data.progress) {
                    $('#stat-sent').text(data.progress.sent || 0);
                    $('#stat-failed').text(data.progress.failed || 0);

                    const total = data.progress.total || 1;
                    const p = Math.round((((data.progress.sent || 0) + (data.progress.failed || 0)) / total) * 100);
                    $('#stat-progress').text(p + '%');
                    $('#progress-bar').css('width', p + '%');

                    if (data.running) {
                        $('#current-op').text('Sending: ' + (data.progress.current_email || '...'));
                    }

                    if (data.progress.recipient_statuses) {
                        Object.entries(data.progress.recipient_statuses).forEach(([email, status]) => {
                            const col = $(`tr[data-email="${email.replace(/["\\]/g, '\\$&')}"] .status-col`);
                            if (col.length && col.text() !== status) {
                                col.text(status);
                                col.removeClass('status-sent status-failed status-sending text-slate-400');
                                if (status === 'Sent') col.addClass('status-sent');
                                else if (status === 'Failed' || status === 'Cancelled') col.addClass('status-failed');
                                else if (status.includes('Sending')) col.addClass('status-sending');
                                else col.addClass('text-slate-400');
                            }
                        });
                    }
                }

                if (data.running) {
                    $('#btn-start').addClass('hidden');
                    $('#btn-retry').addClass('hidden');
                    $('#btn-stop').removeClass('hidden');
                } else {
                    $('#btn-stop').addClass('hidden');
                    $('#btn-start').removeClass('hidden');

                    if (data.failed_list && data.failed_list.length > 0) {
                        $('#btn-retry').removeClass('hidden');
                    } else {
                        $('#btn-retry').addClass('hidden');
                    }

                    if (data.progress && data.progress.total > 0) {
                        if ((data.progress.sent + data.progress.failed) === data.progress.total) {
                            $('#current-op').text('Dispatch Complete');
                        } else {
                            $('#current-op').text('System Idle (Stopped)');
                        }
                    } else {
                        $('#current-op').text('System Idle');
                    }
                }
            });

            $.get('/api/logs', (d) => {
                const v = $('#log-viewer');
                if (d) {
                    const reversedLogs = d.split('\n').filter(line => line.trim() !== '').reverse().join('\n');
                    v.text(reversedLogs);
                } else {
                    v.text('');
                }
            });
        }, 1000);

        $('#clear-logs-btn').click(() => { $.post('/api/logs/clear', () => { $('#log-viewer').text(''); notify('Cleared'); }); });

        $(document).ready(() => { loadConfig(); loadTemplates(); });
    </script>
</body>

</html>
